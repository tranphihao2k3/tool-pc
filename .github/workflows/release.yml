# GitHub Actions workflow: build Tauri release và attach artifacts + latest.json cho auto-updater.
#
# Trigger:
#   - Tag đẩy lên (vd: v0.1.0) → build + tạo GitHub Release với artifacts
#   - Workflow_dispatch từ GitHub UI → build only, cần publish thủ công
#
# Setup:
#   1. Settings → Secrets → New repository secret:
#      - TAURI_SIGNER_PRIVATE_KEY: nội dung file ~/.tauri/<name>.key (base64)
#      - TAURI_SIGNER_PRIVATE_KEY_PASSWORD: password đã set khi gen key
#   2. Sửa OWNER / REPO trong biến env bên dưới.
#   3. Đẩy tag: `git tag v0.1.0 && git push --tags`
#
# Khi release publish, `tauri build` tự tạo `latest.json` trong bundle/updater/.
# Workflow upload cả latest.json lên release, để client updater đọc được.

name: Release Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # Sửa 2 dòng này cho đúng repo của bạn.
  OWNER: ${{ github.repository_owner }}
  REPO: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Windows prerequisites
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Tauri cần WebView2 + WiX + NSIS — hầu hết đã có sẵn trên runner.
          # Chỉ cần đảm bảo WiX Toolset 3 đã được cài (tự động download lần đầu).
          Write-Host "Windows runner ready"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNER_PRIVATE_KEY }}
          TAURI_SIGNER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNER_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PC Manager Pro ${{ github.ref_name }}"
          releaseBody: "Auto-update enabled. See assets below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifacts (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pc-manager-pro-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/updater/*.json
          if-no-files-found: warn
